name: Weekly scrapers

on:
  schedule:
    # Attenzione: l'orario è in UTC, non in ora italiana!
    # Ogni domenica alle 05:00 ora italiana in inverno (CET, UTC+1) -> "0 4 * * 0"
    # In estate (CEST, UTC+2) lo stesso cron corrisponde alle 06:00;
    # per le 05:00 anche in estate usa "0 3 * * 0"
    - cron: "0 4 * * 0"
  workflow_dispatch: {}   

permissions:
  contents: read

jobs:
  scrape-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly SuperEnalotto scraper and send email
        env:
          PYTHONUNBUFFERED: "1"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -u main.py

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-logs
          path: logs/
          retention-days: 7
          if-no-files-found: ignore